name: nexora-ai-deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  
jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: aws configure
          uses: aws-actions/configure-aws-credentials@v6
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: login to ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v6

        - name: build gateway
          run: | 
            docker build \
            -f backend/gateway/Dockerfile \
            -t gateway backend

        - name: tag gateway
          run: |
            docker tag gateway:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/gateway:latest

        - name: push gateway
          run: |
            docker push \
            ${{ env.AWS_ACCOUNT_ID}}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/gateway:latest
        

        - name: build auth
          run: | 
            docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service backend
            
        - name: tag auth
          run: |
            docker tag auth-service:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/auth-service:latest

        - name: push auth
          run: |
            docker push \
            ${{ env.AWS_ACCOUNT_ID}}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/auth-service:latest


        - name: build chat
          run: | 
            docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service backend
            
        - name: tag chat
          run: |
            docker tag chat-service:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/chat-service:latest

        - name: push chat
          run: |
            docker push \
            ${{ env.AWS_ACCOUNT_ID}}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/chat-service:latest


        - name: build agent
          run: | 
            docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service backend
            
        - name: tag agent
          run: |
            docker tag agent-service:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/agent-service:latest

        - name: push agent
          run: |
            docker push \
            ${{ env.AWS_ACCOUNT_ID}}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/agent-service:latest


        - name: build billing
          run: | 
            docker build \
            -f backend/services/billing/Dockerfile \
            -t billing-service backend
            
        - name: tag billing
          run: |
            docker tag billing-service:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/billing-service:latest

        - name: push billing
          run: |
            docker push \
            ${{ env.AWS_ACCOUNT_ID}}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/billing-service:latest


        - name: deploy gateway
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.GATEWAY_SERVICE }} \
            --force-new-deployment

        - name: deploy auth
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AUTH_SERVICE }} \
            --force-new-deployment
            
        - name: deploy chat
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.CHAT_SERVICE }} \
            --force-new-deployment
            
        - name: deploy agent
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AGENT_SERVICE }} \
            --force-new-deployment
            
        - name: deploy billing
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.BILLING_SERVICE }} \
            --force-new-deployment
      
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: build frontend
          run: |
            cd frontend
            npm install
            npm run build
        
        - name: aws configure
          uses: aws-actions/configure-aws-credentials@v6
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: upload frontend to S3
          run: |
            aws s3 sync \
            frontend/dist \
            s3://${{ secrets.S3_BUCKET }} \
            --delete
        - name: invalidate CloudFront cache
          run: |
            aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"